name: Validation du corpus

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Vérifier qu'aucun document PDF ou EPUB n'est versionné
        run: |
          fichiers=$(git ls-files -- '*.pdf' '*.PDF' '*.epub')
          if [ -n "$fichiers" ]; then
            echo "Documents interdits dans le dépôt (droit d'auteur, règle 9.1) :"
            echo "$fichiers"
            exit 1
          fi

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Valider les fiches (schémas, vocabulaire, règle de validation)
        run: python scripts/valider_corpus.py

      - name: Vérifier que l'index est à jour
        run: python scripts/generer_index.py --check

      - name: Rapport d'impact des règles
        run: python scripts/impact_regles.py
