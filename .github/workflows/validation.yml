name: Validation du corpus

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Valider les fiches (schémas, vocabulaire, règle des 2 sources)
        run: python scripts/valider_corpus.py

      - name: Vérifier que l'index est à jour
        run: python scripts/generer_index.py --check
